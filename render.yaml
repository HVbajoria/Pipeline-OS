# Render Blueprint for PipelineOS
# Docs: https://render.com/docs/blueprint-spec
#
# This deploys the app as a Docker web service built from the repo Dockerfile.
# The container is a single always-on Node process that serves the SPA plus the
# /api and /mcp surfaces, so it must run as a "web" service (not static) to keep
# the SSE stream (/api/events) and the maintenance scheduler alive.
#
# To deploy: push this file to the default branch, then in the Render dashboard
# choose "New +" -> "Blueprint" and point it at this repository.

services:
  - type: web
    name: pipelineos
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Free tier: spins down after ~15 min idle and cold-starts on next request.
    # Change to "starter" for an always-on instance (paid).
    plan: free
    region: oregon
    branch: main
    # Render's platform health check. The app exposes a liveness endpoint here.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # The container listens on $PORT and binds 0.0.0.0 when NODE_ENV=production.
      # Render injects PORT automatically; the Dockerfile defaults to 8080 and
      # server.ts reads process.env.PORT, so no explicit PORT is required. We set
      # it explicitly to match the Dockerfile's EXPOSE for clarity.
      - key: PORT
        value: "8080"
      - key: NODE_ENV
        value: production
      # Demo-safe default: in-memory state (resets when the instance sleeps or
      # restarts). Switch to "firestore" and add Firebase credentials for durable,
      # cross-restart state.
      - key: PERSISTENCE_BACKEND
        value: memory
      - key: LOG_LEVEL
        value: info
      # Firebase Authentication. Set the sync:false values in the Render
      # dashboard before the next deploy. Browser VITE_* values are public Firebase
      # config; the session secret and service-account JSON are server secrets.
      - key: FIREBASE_AUTH_ENABLED
        value: "true"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_DEFAULT_TENANT_ID
        value: pipelineos-demo
      - key: FIREBASE_DEFAULT_ROLE
        value: candidate
      - key: SESSION_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
