name: Bug report
description: Report a reproducible product or engineering problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include credentials, tokens, candidate data, resumes, production records, or other private information.

        For suspected vulnerabilities, authorization bypasses, tenant-isolation failures, or exposed secrets, do not use this form. Follow [SECURITY.md](../../SECURITY.md) instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the behavior you expected.
      placeholder: Tell us what went wrong and what should have happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe set of steps that reproduces the problem.
      placeholder: |
        1. Start the application with ...
        2. Select ...
        3. Call ...
        4. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the application version or commit SHA.
      placeholder: 1.0.0 or abc1234
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Browser UI
        - HTTP API
        - MCP endpoint
        - WebMCP adapter
        - Authentication or authorization
        - Persistence or deployment
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include safe environment details such as OS, browser, Node version, and deployment platform. Do not include secrets.
      placeholder: macOS, Node 20, Chrome, local development or Render
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste redacted logs or attach screenshots with all private data removed.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed credentials, tokens, personal data, and candidate/recruiter information.
          required: true
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is not a security vulnerability or exposed secret.
          required: true
